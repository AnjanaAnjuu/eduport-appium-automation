[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py Test_*.py
python_functions = test_*
addopts = -v
markers =
    signup: SUP-01 through SUP-20; requires explicit ALLOW_SIGNUP_TESTS=true and independent new-user staging state
    onboarding: onboarding flow; requires an authenticated_onboarding staging fixture that resets one-time onboarding state
    splash: splash screen and transition tests
    coin_quiz: coin/problem-quiz suite; requires explicit ALLOW_COIN_TESTS=true and prepared staging data
    home_search: Home Search suite; requires inspected SEARCH_TEST_DATA and an authenticated course account
    sends_otp: sends real SMS; requires TEST_MOBILE_NUMBER and ALLOW_OTP_SEND=true
    requires_valid_otp: requires a valid OTP supplied through TEST_VALID_OTP
